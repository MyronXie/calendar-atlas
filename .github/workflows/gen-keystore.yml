name: gen-keystore

# 一次性：生成一个固定的 Android 调试签名 keystore（用于让每次 CI 构建都使用同一签名，便于覆盖安装）。
# 运行后下载 artifact 里的 debug.keystore.base64.txt，把其内容存为仓库 Secrets 的 ANDROID_DEBUG_KEYSTORE。
on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          base64 -w0 debug.keystore > debug.keystore.base64.txt
          echo "keystore generated"
      - name: Upload keystore base64
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-keystore
          path: debug.keystore.base64.txt
