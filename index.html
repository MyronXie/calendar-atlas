<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日历足迹</title><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png"><link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="vendor/MarkerCluster.css"><link rel="stylesheet" href="vendor/MarkerCluster.Default.css"><link rel="stylesheet" href="style.css"></head><body><aside id="drawer" aria-label="排行" aria-hidden="false">

><option value="bd09">BD-09（百度）</option></select></label></details></section><section data-content="filters" hidden><label class="check"><input id="exclude" type="checkbox" checked>应用排除规则</label><details id="rule-list-details" class="settings-fold"><summary><b>config.json</b><small id="blacklist-summary"></small></summary><div class="blacklist-toolbar"><select id="blacklist-type" aria-label="黑名单类型"><option value="all">全部类型</option><option value="event">事件 event</option><option value="place">地点 place</option></select><input id="blacklist-search" placeholder="搜索规则" aria-label="搜索黑名单"></div><div class="quick"><button id="add-blacklist">新增规则</button><button id="reload-blacklist">重新读取文件</button></div><p id="blacklist-error" role="alert"></p><div id="blacklist-rows"></div></details></section><section data-content="appearance" hidden><details class="settings-fold"><summary><b>事件计数方式</b></summary><label class="check"><input id="merge-same-day" type="checkbox" checked aria-describedby="merge-same-day-help">同日去重</label><small id="merge-same-day-help">同一天重复出现的地点和同伴各计一次。</small><label class="check"><input id="split-trip-days" type="checkbox" checked aria-describedby="split-trip-days-help">跨天行程按天计</label><small id="split-trip-days-help">同伴按行程天数计，地点按明确记录的日期计。</small><label class="check"><input id="recurring" type="checkbox" checked aria-describedby="recurring-help">按周期展开事件</label><small id="recurring-help">把重复日程的每次实际发生都列入统计，取消与改期按日历记录处理。</small></details><details id="theme-list-details" class="settings-fold"><summary><b>配色方案</b><small id="theme-current"></small></summary><div id="theme-options" class="theme-options"></div></details>

</section></div></aside><dialog id="editor"><form id="editform"><h2>编辑地点</h2><label>地点名称<input name="location" required maxlength="1000"></label><label>地址<input name="address"></label><div class="fieldrow"><label>国家 / 地区<input name="country"></label><label>省份<input name="province"></label><label>城市<input name="city"></label></div><div class="fieldrow"><label>纬度<input name="lat" type="number" min="-90" max="90" step="any"></label><label>经度<input name="lon" type="number" min="-180" max="180" step="any"></label></div><input type="hidden" name="datum" value="gcj02"><div class="fieldrow"><label>主分类<select name="type"><option value="other">其他</option><option value="food">餐饮</option><option value="fun">娱乐</option><option value="art">文化</option><option value="shop">购物</option><option value="out">户外</option><option value="sport">运动</option><option value="trans">交通</option><option value="stay">住宿</option><option value="edu">学习与工作</option><option value="home">个人地点</option></select></label><label>标签<input name="labels" placeholder="寿司；日本料理；自助"></label><label>营业状态<select name="valid"><option value="">正常／未标注</option><option value="no">现已停业（保留历史）</option></select></label></div><button type="button" id="pickpoint">在地图上点选坐标</button><p id="editerror" role="alert"></p><div class="quick"><button type="button" id="cancel">取消</button><button class="primary" id="saveplace">保存到 CSV</button></div></form></dialog><dialog id="blacklist-editor"><form id="blacklist-form"><h2 id="blacklist-editor-title">新增规则</h2><label class="check"><input name="enabled" type="checkbox" checked>启用</label><div class="fieldrow"><label>类型<select name="type"><option value="event">事件 event</option><option value="place">地点 place</option></select></label><label>匹配方式<select name="match_type"><option value="contains">包含关键词</option><option value="exact">完整名称</option><option value="uid">事件 UID</option></select></label></div><label>匹配内容<input name="value" required maxlength="2000"></label><label>原因（可选）<textarea name="reason
