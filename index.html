<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日历地图</title><link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png"><link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="vendor/MarkerCluster.css"><link rel="stylesheet" href="vendor/MarkerCluster.Default.css"><link rel="stylesheet" href="style.css"></head><body><aside id="drawer" aria-label="排行" aria-hidden="false">
<div class="drawer-top"><div class="drawerhead"><b>排行</b><button id="close-drawer" aria-label="收起排行">收起 ‹</button></div>
<nav class="drawertabs" aria-label="排行"><button data-panel="places" data-tab="places" class="active">地点排行</button><button data-panel="types" data-tab="types">类型排行</button><button data-panel="partners" data-tab="partners">同伴排行</button><button data-panel="groups" data-tab="groups">组别排行</button></nav></div><div class="drawer-scroll"><section data-content="rank"><div id="ranking"></div></section><p id="status" role="status" aria-live="polite"></p></div></aside><main><div class="app-toolbar"><button id="toggle-drawer" aria-label="打开排行抽屉" aria-controls="drawer" aria-expanded="true">☰ 排行</button><button id="annual" aria-label="年度回顾">📅 年度回顾</button><button id="toggle-settings" aria-controls="settings-drawer" aria-expanded="false">⚙ 设置</button></div><section class="mapcard"><div class="mapbar"><button class="section-heading" id="collapse-map" aria-controls="map-body" aria-expanded="true"><span class="section-chevron">▾</span>地图</button><div class="maptools"><select id="level" aria-label="地图层级"><option value="place">地点</option><option value="shanghai">上海市</option><option value="domestic">国内</option><option value="country">国家 / 地区</option></select><select id="provider" aria-label="底图"></select><button id="reset" title="重置地图视野，保留当前筛选">重置视野</button></div></div><div id="map-body"><input id="heatmap" type="checkbox" hidden><input id="aggregate" type="checkbox" checked hidden><div class="canvaswrap"><div id="map" aria-label="足迹地图"></div><div id="mapnotice" role="status"></div></div></div></section><section class="timeline timeline-main"><div class="timelinehead"><button class="section-heading" id="collapse-timeline" aria-controls="timeline-body" aria-expanded="true"><span class="section-chevron">▾</span>时间足迹</button><div class="periodtools"><div class="unit-toggle" role="group" aria-label="时间单位"><button type="button" data-unit="year" class="active">年</button><button type="button" data-unit="month">月</button></div><input type="hidden" id="timeunit" value="year"><button id="year">最近</button><button id="all">全部</button></div></div><div id="timeline-body"><div class="timeline-scroll"><div id="timeline-track"><div id="yearbars" aria-label="事件量时间轴"></div><div id="brushtrack"><output id="period-start" class="brush-label"></output><output id="period-end" class="brush-label"></output><div id="brushselection"><button id="brushleft" aria-label="调整起始时间" role="slider" tabindex="0">Ⅱ</button><button id="brushright" aria-label="调整结束时间" role="slider" tabindex="0">Ⅱ</button></div></div></div></div><input id="from" type="date" hidden><input id="to" type="date" hidden><input id="yearfrom" type="range" hidden><input id="yearto" type="range" hidden></div></section><section class="events"><div class="eventhead"><button class="section-heading" id="collapse-eventlist" aria-controls="eventlist-body" aria-expanded="true"><span class="section-chevron">▾</span><span id="eventtitle">事件</span></button><div class="event-display-options"><label class="check"><input id="showplaces" type="checkbox" checked>地点</label><label class="check"><input id="showpeople" type="checkbox" checked>人物</label></div></div><div id="eventlist-body"><form id="searchform" class="eventsearchbar"><select id="searchscope" aria-label="搜索范围"><option value="all">全部</option><option value="event">事件</option><option value="place">地点</option><option value="person">人物</option><option value="note">备注</option></select><input id="search" class="eventsearch" type="search" placeholder="输入关键词，回车叠加筛选" aria-label="关键词筛选"><button type="submit" title="添加筛选" aria-label="添加筛选">＋</button><button id="unselect" type="button" title="清空筛选" aria-label="清空筛选">🗑</button></form><div id="activefilters"></div><div id="events"><div class="empty" role="status">正在读取日历…</div></div><button id="more" hidden>加载更多</button></div></section></main><aside id="settings-drawer" aria-label="设置" aria-hidden="true" inert><div class="drawer-top"><div class="drawerhead"><b>设置</b><button id="close-settings" aria-label="收起设置">收起 ›</button></div><nav class="settings-tabs"><button data-settings-panel="manage" class="active">地点管理</button><button data-settings-panel="filters">排除设置</button><button data-settings-panel="appearance">偏好</button></nav></div><div class="drawer-scroll"><section data-content="manage"><details id="place-list-details" class="settings-fold"><summary><b>place.csv</b><small id="referenceinfo"></small></summary><div class="managebar"><select id="placestate" aria-label="定位状态"><option value="all">全部地点</option><option value="exact">已有坐标</option><option value="pending">未定位地点</option><option value="closed">现已停业</option></select><input id="placesearch" placeholder="搜索所有地点" aria-label="搜索地点库"></div><div class="quick"><button id="addplace">新增地点</button><button id="reloadplaces">重新读取 CSV</button></div><div id="placelist"></div><button id="placemore">加载更多</button></details><details><summary>坐标设置</summary><label>未声明坐标系的记录<select id="datum"><option value="wgs84">WGS84 / 原始坐标</option><option value="gcj02">GCJ-02（高德 / 腾讯）</option><option value="bd09">BD-09（百度）</option></select></label></details></section><section data-content="filters" hidden><label class="check" title="按 RRULE 生成范围内的每次发生，并处理 EXDATE 和单次改期；关闭后仅看源事件首次时间"><input id="recurring" type="checkbox" checked>按周期展开事件</label><label class="check"><input id="exclude" type="checkbox" checked>应用排除规则</label><details id="rule-list-details" class="settings-fold"><summary><b>config.json</b><small id="blacklist-summary"></small></summary><div class="blacklist-toolbar"><select id="blacklist-type" aria-label="黑名单类型"><option value="all">全部类型</option><option value="event">事件 event</option><option value="place">地点 place</option></select><input id="blacklist-search" placeholder="搜索规则" aria-label="搜索黑名单"></div><div class="quick"><button id="add-blacklist">新增规则</button><button id="reload-blacklist">重新读取文件</button></div><p id="blacklist-error" role="alert"></p><div id="blacklist-rows"></div></details><label class="upload secondary">导入其他日历<input id="ics" type="file" accept=".ics"></label></section><section data-content="appearance" hidden><details id="theme-list-details" class="settings-fold"><summary><b>配色方案</b><small id="theme-current"></small></summary><div id="theme-options" class="theme-options"></div></details>
<div class="meta-sources">
<div class="meta-row"><span>日历更新时间：<output id="cal-version">—</output></span><button class="meta-refresh" data-meta="calendar" type="button" title="刷新日历" aria-label="刷新日历">↻</button></div>
<div class="meta-row"><span>地点更新时间：<output id="place-version">—</output></span><button class="meta-refresh" data-meta="places" type="button" title="刷新地点" aria-label="刷新地点">↻</button></div>
<div class="meta-row"><span>配色更新时间：<output id="blacklist-version">—</output></span><button class="meta-refresh" data-meta="blacklist" type="button" title="刷新配色" aria-label="刷新配色">↻</button></div>
<p id="meta-status" role="status"></p>
</div>
</section></div></aside><dialog id="editor"><form id="editform"><h2>编辑地点</h2><label>地点名称<input name="location" required maxlength="1000"></label><label>地址<input name="address"></label><div class="fieldrow"><label>国家 / 地区<input name="country"></label><label>省份<input name="province"></label><label>城市<input name="city"></label></div><div class="fieldrow"><label>纬度<input name="lat" type="number" min="-90" max="90" step="any"></label><label>经度<input name="lon" type="number" min="-180" max="180" step="any"></label></div><input type="hidden" name="datum" value="gcj02"><div class="fieldrow"><label>主分类<select name="type"><option value="other">其他</option><option value="food">餐饮</option><option value="fun">娱乐</option><option value="art">文化</option><option value="shop">购物</option><option value="out">户外</option><option value="sport">运动</option><option value="trans">交通</option><option value="stay">住宿</option><option value="edu">学习与工作</option><option value="home">个人地点</option></select></label><label>标签<input name="labels" placeholder="寿司；日本料理；自助"></label><label>营业状态<select name="valid"><option value="">正常／未标注</option><option value="no">现已停业（保留历史）</option></select></label></div><button type="button" id="pickpoint">在地图上点选坐标</button><p id="editerror" role="alert"></p><div class="quick"><button type="button" id="cancel">取消</button><button class="primary" id="saveplace">保存到 CSV</button></div></form></dialog><dialog id="blacklist-editor"><form id="blacklist-form"><h2 id="blacklist-editor-title">新增规则</h2><label class="check"><input name="enabled" type="checkbox" checked>启用</label><div class="fieldrow"><label>类型<select name="type"><option value="event">事件 event</option><option value="place">地点 place</option></select></label><label>匹配方式<select name="match_type"><option value="contains">包含关键词</option><option value="exact">完整名称</option><option value="uid">事件 UID</option></select></label></div><label>匹配内容<input name="value" required maxlength="2000"></label><label>原因（可选）<textarea name="reason" rows="3" maxlength="4000"></textarea></label><p id="blacklist-form-error" role="alert"></p><div class="quick"><button type="button" id="cancel-blacklist">取消</button><button class="primary" id="save-blacklist">保存</button></div></form></dialog><div id="annual-review" class="annual-overlay" hidden>
 <section class="annual-card" role="dialog" aria-modal="true" aria-labelledby="annual-title">
  <div class="annual-head">
   <div class="annual-year">
    <button id="annual-prev" class="annual-nav" type="button" aria-label="上一年">‹</button>
    <h2 id="annual-title" class="annual-heading-label"></h2>
    <select id="annual-year-select" aria-label="选择年度回顾年份"></select>
    <button id="annual-next" class="annual-nav" type="button" aria-label="下一年">›</button>
   </div>
   <div class="annual-actions">
    <button id="annual-mode" type="button" aria-pressed="false">跨年统计</button>
    <button id="annual-export" type="button" class="primary">导出图片</button>
    <button id="annual-close" type="button">关闭</button>
   </div>
  </div>
  <div id="annual-range-controls" class="annual-range-dates" hidden>
   <label>开始日期<input id="annual-range-from" type="date" required></label>
   <label>结束日期<input id="annual-range-to" type="date" required></label>
  </div>
  <p id="annual-status" class="annual-note" role="status"></p>
  <div id="annual-body"></div>
 </section>
</div>
<script src="vendor/leaflet.js"></script><script src="vendor/leaflet.markercluster.js"></script><script type="module" src="app.js"></script></body></html>
